services:
  - type: web
    name: room-mate
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/room_management.db
    disk:
      name: room-mate-data
      mountPath: /var/data
      sizeGB: 1
